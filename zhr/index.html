  <link rel="manifest" href="manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- PDF.js Library for Client-Side PDF Upload Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window['pdfjs-dist/build/pdf']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

<body class="mobile-app-body">
  <!-- Single Page Application Mounting Point -->

  <!-- Service Worker Registration for PWA Offline App -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('📱 Service Worker Registered Successfully for Medad Zahr App:', reg.scope);
        }).catch((err) => {
          console.log('Service Worker Registration Failed:', err);
        });
      });
    }
  </script>

  <!-- Main ES6 JavaScript Entry Module -->
  <script type="module" src="js/app.js"></script>
