<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Cybersecurity Security Headers & Content Security Policy (CSP) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https: wss:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>مِدادُ زَهْر | Medad Zahr - تطبيق القراءة والأدب والشعر العربي</title>
  <meta name="description" content="تطبيق مِدادُ زَهْر (Medad Zahr) - تطبيق محمول فاخر للقراءة والأدب، رفع كتب PDF، ديوان الشعر، وفلتر +18 الآمن الفائق.">
  <meta name="keywords" content="مداد زهر, تطبيق كتب, PDF, شعر عربي, ديوان الشعر, قراءة آمنة, فلتر 18, Medad Zahr">
  <link rel="icon" type="image/png" href="assets/logo.png">
  
  <!-- PWA Manifest & Mobile App Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D97706">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مِدادُ زَهْر">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <!-- Custom Design Styles -->
  <link rel="stylesheet" href="css/style.css?v=7.0">

  <!-- PDF.js Library for Client-Side PDF Upload Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window['pdfjs-dist/build/pdf']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body class="mobile-app-body">
  <!-- Single Page Application Mounting Point -->
  <div id="app"></div>

  <!-- Service Worker Registration & Cache Clearing for App Updates -->
  <script>
    if ('serviceWorker' in navigator) {
      // Force unregister stale old service workers from previous builds if any
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.update();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=7.0').then((reg) => {
          console.log('📱 Service Worker Updated & Registered for Medad Zahr App:', reg.scope);
        }).catch((err) => {
          console.log('Service Worker Registration Failed:', err);
        });
      });
    }

    // Force clear old LocalStorage keys if medad_v7_clean is not present
    if (localStorage.getItem('medad_v7_clean') !== 'true') {
      localStorage.clear();
      localStorage.setItem('medad_v7_clean', 'true');
      console.log('🧹 Browser Cache & LocalStorage Cleared for Medad Zahr v7.0');
    }
  </script>

  <!-- Main ES6 JavaScript Entry Module -->
  <script type="module" src="js/app.js?v=7.0"></script>
</body>
</html>
